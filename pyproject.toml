[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-prep"
version = "1.2.0"
description = "Zero-dependency repository readiness scanner, secret detector, and AGENTS.md generator for OpenAI Codex."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["openai", "codex", "agents-md", "cli", "llm", "security", "tokens"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
codex-prep = "codex_prep:main"
